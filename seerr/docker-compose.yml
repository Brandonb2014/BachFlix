# Seerr (successor to Overseerr) for the BachFlix request site.
# Run on the Windows Plex server (192.168.0.5) with Docker Desktop (WSL2 backend).
#
# The config uses a NAMED volume on purpose. Seerr's docs warn that bind-mounting a
# Windows folder (C:\...) to /app/config goes over SMB, which has no file locking
# and will eventually corrupt the SQLite database.
#
# First time:   docker volume create seerr-data
# Start:        docker compose up -d
# Update:       docker compose pull seerr; docker compose up -d

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Denver
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - seerr-data:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  seerr-data:
    external: true
